<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 720" width="850" height="720">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f5"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="smokeGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="850" height="720" rx="16" fill="url(#bgGrad)" stroke="#fecaca" stroke-width="2"/>

  <!-- Title Header -->
  <rect x="25" y="20" width="800" height="60" rx="12" fill="url(#headerGrad)" filter="url(#cardShadow)"/>
  <text x="425" y="47" fill="#ffffff" font-size="20" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">⚠️ காற்று எவ்வாறு மாசடைகிறது? (முக்கியக் காரணங்கள்)</text>
  <text x="425" y="68" fill="#fecaca" font-size="12" font-family="'Mukta Malar', sans-serif" text-anchor="middle">10-ஆம் வகுப்பு தமிழ் - இயல் 2: கேட்கிறதா என் குரல்! (சுற்றுச்சூழல் விழிப்புணர்வு வரைபடம்)</text>

  <!-- ================= 4 POLLUTANT CARDS IN 2x2 GRID ================= -->

  <!-- CARD 1: வாகனக் கரும்புகை (Top-Left) -->
  <g transform="translate(30, 95)" filter="url(#cardShadow)">
    <rect width="380" height="210" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0,14 Q 0,0 14,0 L 366,0 Q 380,0 380,14 L 380,38 L 0,38 Z" fill="#fee2e2"/>
    <text x="190" y="25" fill="#991b1b" font-size="15" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">🚗 1. வாகனங்கள் வெளியிடும் கரும்புகை</text>
    
    <!-- Vehicle Illustration -->
    <g transform="translate(25, 55)">
      <!-- Car Body -->
      <path d="M 10,40 L 25,20 L 60,20 L 75,40 L 95,40 L 95,60 L 5,60 L 5,40 Z" fill="#3b82f6"/>
      <!-- Windows -->
      <polygon points="28,24 57,24 55,38 22,38" fill="#e0f2fe"/>
      <!-- Wheels -->
      <circle cx="25" cy="62" r="12" fill="#1e293b"/>
      <circle cx="25" cy="62" r="5" fill="#94a3b8"/>
      <circle cx="75" cy="62" r="12" fill="#1e293b"/>
      <circle cx="75" cy="62" r="5" fill="#94a3b8"/>
      <!-- Exhaust Pipe & Smoke Clouds -->
      <rect x="0" y="52" width="6" height="5" fill="#64748b"/>
      <circle cx="-12" cy="50" r="8" fill="#64748b" opacity="0.6"/>
      <circle cx="-25" cy="45" r="12" fill="#475569" opacity="0.7"/>
      <circle cx="-40" cy="35" r="16" fill="#334155" opacity="0.8"/>
    </g>

    <!-- Content Text -->
    <g transform="translate(130, 52)">
      <text x="0" y="20" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">• மோட்டார் வாகனங்கள் (கார், பைக்,</text>
      <text x="10" y="38" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">பேருந்து, லாரி) மிகுதியாகப் பெருகல்.</text>
      <text x="0" y="62" fill="#dc2626" font-size="12.5" font-weight="800" font-family="'Mukta Malar', sans-serif">வெளியேறும் வாயு:</text>
      <text x="0" y="80" fill="#475569" font-size="12.5" font-weight="bold" font-family="'Mukta Malar', sans-serif">கார்பன் மோனாக்சைடு (CO), கரும்புகை.</text>
      <text x="0" y="102" fill="#64748b" font-size="11.5" font-family="'Mukta Malar', sans-serif">சுவாசக் கோளாறு &amp; கண் எரிச்சலைத் தரும்.</text>
    </g>
  </g>

  <!-- CARD 2: தொழிற்சாலைக் கழிவுப் புகை (Top-Right) -->
  <g transform="translate(440, 95)" filter="url(#cardShadow)">
    <rect width="380" height="210" rx="14" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0,14 Q 0,0 14,0 L 366,0 Q 380,0 380,14 L 380,38 L 0,38 Z" fill="#ffedd5"/>
    <text x="190" y="25" fill="#c2410c" font-size="15" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">🏭 2. தொழிற்சாலைக் கழிவுகள் &amp; புகை</text>
    
    <!-- Factory Illustration -->
    <g transform="translate(20, 50)">
      <!-- Factory Base -->
      <rect x="15" y="40" width="75" height="35" fill="#64748b"/>
      <polygon points="15,40 30,25 45,40 60,25 75,40 90,25 90,40" fill="#475569"/>
      <!-- Tall Chimney -->
      <polygon points="35,40 40,5 55,5 60,40" fill="#dc2626"/>
      <rect x="38" y="2" width="19" height="5" fill="#991b1b"/>
      <!-- Smoke Billowing -->
      <ellipse cx="48" cy="-10" rx="16" ry="10" fill="#475569" opacity="0.6"/>
      <ellipse cx="58" cy="-22" rx="22" ry="12" fill="#334155" opacity="0.7"/>
      <ellipse cx="70" cy="-35" rx="26" ry="14" fill="#1e293b" opacity="0.8"/>
    </g>

    <!-- Content Text -->
    <g transform="translate(130, 52)">
      <text x="0" y="20" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">• ஆலைகளின் உயரமான புகைபோக்கிகள்</text>
      <text x="10" y="38" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">சுத்திகரிக்காமல் நச்சுப் புகையை விடுதல்.</text>
      <text x="0" y="62" fill="#ea580c" font-size="12.5" font-weight="800" font-family="'Mukta Malar', sans-serif">வெளியேறும் வாயு:</text>
      <text x="0" y="80" fill="#475569" font-size="12.5" font-weight="bold" font-family="'Mukta Malar', sans-serif">கந்தக டை-ஆக்சைடு (SO₂), நைட்ரஜன்.</text>
      <text x="0" y="102" fill="#64748b" font-size="11.5" font-family="'Mukta Malar', sans-serif">அமில மழைக்கு (Acid Rain) வழிகோலும்.</text>
    </g>
  </g>

  <!-- CARD 3: குப்பைகள் & நெகிழி எரித்தல் (Bottom-Left) -->
  <g transform="translate(30, 320)" filter="url(#cardShadow)">
    <rect width="380" height="210" rx="14" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0,14 Q 0,0 14,0 L 366,0 Q 380,0 380,14 L 380,38 L 0,38 Z" fill="#fef9c3"/>
    <text x="190" y="25" fill="#854d0e" font-size="15" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">🔥 3. குப்பைகள் &amp; நெகிழி (Plastic) எரிப்பு</text>
    
    <!-- Fire & Trash Illustration -->
    <g transform="translate(30, 60)">
      <!-- Trash Pile -->
      <ellipse cx="45" cy="65" rx="40" ry="12" fill="#78716c"/>
      <rect x="25" y="55" width="18" height="10" fill="#0284c7" rx="2" transform="rotate(-15 25 55)"/>
      <rect x="45" y="52" width="22" height="12" fill="#e11d48" rx="2" transform="rotate(20 45 52)"/>
      <!-- Flames -->
      <path d="M 30,55 Q 35,20 45,10 Q 48,25 55,20 Q 60,35 60,55 Z" fill="#f97316"/>
      <path d="M 38,55 Q 42,30 46,22 Q 50,30 52,55 Z" fill="#facc15"/>
      <!-- Toxic Dioxin Smoke -->
      <circle cx="45" cy="-2" r="10" fill="#475569" opacity="0.6"/>
      <circle cx="35" cy="-18" r="14" fill="#334155" opacity="0.75"/>
      <circle cx="48" cy="-32" r="18" fill="#1e293b" opacity="0.85"/>
    </g>

    <!-- Content Text -->
    <g transform="translate(130, 52)">
      <text x="0" y="20" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">• குப்பைகள், டயர்கள், பிளாஸ்டிக்</text>
      <text x="10" y="38" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">பொருள்களைத் திறந்தவெளியில் எரித்தல்.</text>
      <text x="0" y="62" fill="#ca8a04" font-size="12.5" font-weight="800" font-family="'Mukta Malar', sans-serif">வெளியேறும் வாயு:</text>
      <text x="0" y="80" fill="#475569" font-size="12.5" font-weight="bold" font-family="'Mukta Malar', sans-serif">டையாக்சின் (Dioxin) நச்சுப் புகை.</text>
      <text x="0" y="102" fill="#64748b" font-size="11.5" font-family="'Mukta Malar', sans-serif">புற்றுநோய் &amp; நரம்பு மண்டல பாதிப்பைத் தரும்.</text>
    </g>
  </g>

  <!-- CARD 4: குளிர்பதனப் பெட்டியின் CFC வாயு (Bottom-Right) -->
  <g transform="translate(440, 320)" filter="url(#cardShadow)">
    <rect width="380" height="210" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <!-- Card Header -->
    <path d="M 0,14 Q 0,0 14,0 L 366,0 Q 380,0 380,14 L 380,38 L 0,38 Z" fill="#ede9fe"/>
    <text x="190" y="25" fill="#5b21b6" font-size="15" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">❄️ 4. குளிர்பதனப் பெட்டி (Fridge/AC) CFC</text>
    
    <!-- Fridge & CFC Illustration -->
    <g transform="translate(25, 45)">
      <!-- Refrigerator -->
      <rect x="15" y="10" width="55" height="75" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="2"/>
      <rect x="18" y="13" width="49" height="25" rx="4" fill="#e0f2fe"/>
      <rect x="18" y="42" width="49" height="40" rx="4" fill="#bae6fd"/>
      <!-- Handles -->
      <line x1="22" y1="20" x2="22" y2="30" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
      <line x1="22" y1="50" x2="22" y2="65" stroke="#0369a1" stroke-width="3" stroke-linecap="round"/>
      <!-- CFC Gas floating upwards -->
      <circle cx="85" cy="30" r="9" fill="#8b5cf6" opacity="0.6"/>
      <text x="85" y="34" fill="#ffffff" font-size="8" font-weight="bold" text-anchor="middle">CFC</text>
      <circle cx="80" cy="5" r="11" fill="#7c3aed" opacity="0.75"/>
      <text x="80" y="9" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">CFC</text>
      <circle cx="95" cy="-15" r="13" fill="#6d28d9" opacity="0.85"/>
      <text x="95" y="-11" fill="#ffffff" font-size="10" font-weight="bold" text-anchor="middle">CFC</text>
    </g>

    <!-- Content Text -->
    <g transform="translate(130, 52)">
      <text x="0" y="20" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">• குளிர்சாதனப் பெட்டி மற்றும் ஏசி (AC)</text>
      <text x="10" y="38" fill="#0f172a" font-size="13" font-weight="bold" font-family="'Mukta Malar', sans-serif">ஆகியவற்றைப் பயன்படுத்துதல்.</text>
      <text x="0" y="62" fill="#7c3aed" font-size="12.5" font-weight="800" font-family="'Mukta Malar', sans-serif">வெளியேறும் வாயு:</text>
      <text x="0" y="80" fill="#475569" font-size="12.5" font-weight="bold" font-family="'Mukta Malar', sans-serif">குளோரோ புளோரோ கார்பன் (CFC).</text>
      <text x="0" y="102" fill="#dc2626" font-size="12" font-weight="bold" font-family="'Mukta Malar', sans-serif">⚠️ ஓசோன் படலத்தைக் (Ozone) கிழிக்கும்!</text>
    </g>
  </g>

  <!-- ================= BOTTOM SUMMARY & SOLUTION BAR ================= -->
  <g transform="translate(25, 545)" filter="url(#cardShadow)">
    <rect width="800" height="150" rx="14" fill="#1e293b"/>
    
    <!-- Left: Major Impacts -->
    <g transform="translate(25, 20)">
      <text x="0" y="18" fill="#f87171" font-size="15" font-weight="bold" font-family="'Mukta Malar', sans-serif">⚡ காற்று மாசுபாட்டின் கொடிய விளைவுகள்:</text>
      <text x="15" y="42" fill="#e2e8f0" font-size="13" font-family="'Mukta Malar', sans-serif">• கண் எரிச்சல், ஆஸ்துமா, நுரையீரல் புற்றுநோய் உள்ளிட்ட சுவாச நோய்கள்.</text>
      <text x="15" y="64" fill="#e2e8f0" font-size="13" font-family="'Mukta Malar', sans-serif">• அமில மழை பொழிந்து பயிர்களும் நீர்நிலைகளும் நஞ்சாதல்.</text>
      <text x="15" y="86" fill="#e2e8f0" font-size="13" font-family="'Mukta Malar', sans-serif">• ஓசோன் படலத்தில் ஓட்டை விழுந்து, புறஊதாக் கதிர்களால் பூமி வெப்பமயமாதல் (Global Warming).</text>
    </g>

    <!-- Solution Banner Pill -->
    <rect x="25" y="112" width="750" height="28" rx="8" fill="#15803d"/>
    <text x="400" y="131" fill="#ffffff" font-size="12.5" font-weight="bold" font-family="'Mukta Malar', sans-serif" text-anchor="middle">🌱 தீர்வு: அதிக அளவில் மரங்களை நட்டு வளர்ப்போம்! பொதுப் போக்குவரத்தைப் பயன்படுத்தி காற்றைக் காப்போம்!</text>
  </g>
</svg>
